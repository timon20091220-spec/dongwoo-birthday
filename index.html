function initFireworks(){
  if(fwCanvas)return;

function fwRgb(c,a){

function fwFrame(){
  requestAnimationFrame(fwFrame);

  }
  // particles
  if(fwParts.length>450)fwParts.splice(0,fwParts.length-450);
  fwCtx.globalCompositeOperation='lighter';
  for(let i=fwParts.length-1;i>=0;i--){
    const p=fwParts[i];
    p.life--;
    if(p.life<=0){fwParts.splice(i,1);continue}
    p.vy+=p.g;
    p.vx*=0.985;
    p.vy*=0.985;
    p.x+=p.vx;
    p.y+=p.vy;
    const a=p.life/p.max;
    const col=p.c;
    // outer glow
    fwDraw(p.x,p.y,p.size*2.4,fwRgb(col,a*0.14));
    // inner core
    fwDraw(p.x,p.y,p.size,fwRgb(col,a));
    // bright center
    fwDraw(p.x,p.y,p.size*0.45,'rgba(255,255,255,'+(a*0.9)+')');
  }
}
function fwDraw(x,y,r,fill){
  fwCtx.beginPath();
  fwCtx.arc(x,y,r,0,Math.PI*2);
  fwCtx.fillStyle=fill;
  fwCtx.fill();
}
function fwTrail(x,y,c){
  fwParts.push({x,y,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,life:10,max:10,size:1.2,g:0,c});
}
function fwBurst(x,y,p){
  if(fwW>0&&(x<0||x>fwW||y<0||y>fwH))return;
  // flash core
  for(let i=0;i<6;i++){
    fwParts.push({x,y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,life:16,max:16,size:4,g:0,c:[255,255,255]});
  }
  const sparkle=Math.random()<0.35;
  for(let i=0;i<58;i++){
    const ang=Math.random()*Math.PI*2;
    const sp=1.5+Math.random()*4.8;
    const c=p[Math.floor(Math.random()*p.length)];
    const gold=sparkle&&i%3===0;
    const life=gold?50+Math.random()*20:32+Math.random()*18;
    fwParts.push({
      x,y,
      vx:Math.cos(ang)*sp,
      vy:Math.sin(ang)*sp,
      life,max:life,
      size:gold?1.6:1.8+Math.random()*1.2,
      g:gold?0.035:0.055+Math.random()*0.04,
      c:gold?[255,240,170]:c,
    });
  }
  // crackle
  if(sparkle){
    setTimeout(()=>{
      for(let i=0;i<24;i++){
        const ang=Math.random()*Math.PI*2;
        const sp=Math.random()*2.4;
        const life=18+Math.random()*10;
        fwParts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-0.5,life,max:life,size:1,g:0.05+Math.random()*0.02,c:[255,255,255]});
      }
    },280);
  }
}
function fwRocket(x,y,tx,ty,p){
  const dx=tx-x, dy=ty-y, len=Math.hypot(dx,dy);
  fwRockets.push({x,y,tx,ty,wob:Math.random()*6,sp:5+len*0.012,p});
}
function fwCelebrate(n){
  if(!fwCanvas)initFireworks();
  const w=fwW||document.documentElement.clientWidth;
  const h=fwH||document.documentElement.clientHeight;
  for(let i=0;i<n;i++){
    const p=FW_PALETTES[Math.floor(Math.random()*FW_PALETTES.length)];
    const tx=w*(0.12+Math.random()*0.76);
    const ty=h*(0.12+Math.random()*0.42);
    setTimeout(()=>fwRocket(w*(0.08+Math.random()*0.84),h+20,tx,ty,p),i*230);
  }
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function fmt(n){return String(Number(n)||0).toLocaleString()}

function nl2br(s){return esc(s).replace(/\n/g,'<br>')}

function applySettings(){
  document.getElementById('hero-title').innerHTML=nl2br(settings.title);
  document.getElementById('hero-name').textContent=settings.name;
  document.getElementById('hero-sub').innerHTML=nl2br(settings.subtitle);
  document.getElementById('bank-name').textContent=settings.bankName;
  document.getElementById('bank-account').textContent=settings.bankAccount;
  document.getElementById('bank-holder').textContent='예금주 · '+settings.bankHolder;
  document.title=(settings.name||'동우')+'야, 생일 축하해';
  renderAmountChips();
  renderTotal();
}

function renderAmountChips(){
  const wrap=document.getElementById('amount-chips');
  wrap.innerHTML='';
  (settings.amounts||[]).forEach(v=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='amount-chip';
    b.textContent=fmt(v)+'원';
    b.onclick=()=>{
      const inp=document.getElementById('post-amount');
      inp.value=(Number(inp.value)||0)+v;
      b.classList.add('on');
      b.style.transform='scale(.95)';
      setTimeout(()=>{
        b.classList.remove('on');
        b.style.transform='';
      },260);
    };
    wrap.appendChild(b);
  });
}

function renderTotal(){
  const total=(postsCache||[]).reduce((a,p)=>a+(Number(p.amount)||0),0);
  document.getElementById('fund-total').textContent=fmt(total)+'원';
  const note=document.getElementById('fund-note');
  if(total>=100000)note.textContent='와, 천재 폭발 반응! 동우가 울지도 몰라요';
  else if(total>=50000)note.textContent='핵심 투자자들 덕분에 펀딩 대박이에요';
  else if(total>=20000)note.textContent='훈훈한 정이 느껴져요. 고마워요!';
  else if(total>=10000)note.textContent='동우의 미소를 위한 투자, 시작됐어요';
  else if(total>=5000)note.textContent='조금씩 모이면 큰 선물이 될 거예요';
  else note.textContent='후원해주면 동우가 세배로 기뻐해요';
}

function renderPosts(list){
  const wrap=document.getElementById('post-list');
  const sub=document.getElementById('post-sub');
  if(!list.length){
    wrap.innerHTML='<div class="empty-text">아직 기록이 없어요.<br>첫 번째 후원 &amp; 축하 메시지를 남겨보세요!</div>';
    sub.textContent='아직 기록이 없습니다';
    return;
  }
  sub.textContent='총 '+list.length+'개의 후원 &amp; 축하 메시지';
  wrap.innerHTML='';
  list.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='msg-card';
    const g=AVATAR_GRADIENTS[i%AVATAR_GRADIENTS.length];
    const amt=Number(p.amount)||0;
    const donBadge=amt>0?'<div class="msg-donation">💰 '+fmt(amt)+'원 후원</div>':'';
    el.innerHTML='<div class="msg-avatar" style="background:'+g+'">'+esc((p.name||'?')[0])+'</div><div class="msg-main"><div class="msg-top"><div class="msg-name">'+esc(p.name)+'</div><div class="msg-time">'+formatTime(p.time)+'</div></div>'+donBadge+'<div class="msg-body">'+esc(p.text)+'</div></div><button class="del-btn" title="삭제" onclick="delPost(\''+p.id+'\')">✕</button>';
    wrap.appendChild(el);
  });
  renderTotal();
}

function formatTime(t){
  if(!t)return'';
  try{
    const d=t.toDate?t.toDate():new Date(t);
    const now=new Date();
    const diff=now-d;
    if(diff<0)return '';
    if(diff<60000)return '방금';
    if(diff<3600000)return Math.floor(diff/60000)+'분 전';
    if(diff<86400000)return Math.floor(diff/3600000)+'시간 전';
    const m=d.getMonth()+1, day=d.getDate();
    return m+'/'+day;
  }catch(e){return ''}
}

function updateCount(){
  document.getElementById('char-count').textContent=document.getElementById('post-text').value.length+' / 300';
}

async function sendPost(){
  const btn=document.getElementById('btn-post');
  const name=document.getElementById('post-name').value.trim();
  const amount=Math.max(0,Number(document.getElementById('post-amount').value)||0);
  const text=document.getElementById('post-text').value.trim();
  if(!name){showToast('이름을 입력해주세요');return}
  if(!text){showToast('메시지를 입력해주세요');return}
  if(!fs){showToast('연결 오류입니다. 잠시 후 다시 시도해주세요');return}
  btn.disabled=true;
  try{
    await fs.collection('birthday_posts').add({name,amount,text,time:new Date()});
    document.getElementById('post-amount').value='';
    document.getElementById('post-text').value='';
    document.querySelectorAll('.amount-chip').forEach(c=>c.classList.remove('on'));
    updateCount();
    showToast(amount>0?fmt(amount)+'원 후원 기록이 등록됐어요! 소중한 정성 감사합니다':'메시지가 전달되었습니다');
    if(amount>0)fwCelebrate(5);
    else fwCelebrate(1);
  }catch(e){
    showToast('전송 실패. 다시 시도해주세요');
    console.warn(e);
  }
  btn.disabled=false;
}

function copyAccount(){
  const v=(settings.bankName||'')+' '+(settings.bankAccount||'');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(()=>showToast('계좌번호가 복사됐어요')).catch(()=>showToast('계좌 : '+v));
  }else{
    showToast('계좌 : '+v);
  }
}

function tossSend(){
  const amt=Math.max(0,Number(document.getElementById('post-amount').value)||0);
  const acct=String(settings.bankAccount||'').replace(/[^0-9]/g,'');
  const bank=encodeURIComponent(settings.bankName||'토스뱅크');
  if(!acct){showToast('계좌번호가 설정되지 않았어요. 관리자 설정을 확인해주세요');return}
  const url='supertoss://send?bank='+bank+'&accountNo='+acct+(amt>0?'&amount='+amt:'');
  try{
    const iframe=document.createElement('iframe');
    iframe.style.display='none';
    iframe.src=url;
    document.body.appendChild(iframe);
    setTimeout(()=>{try{iframe.remove()}catch(e){}},2000);
  }catch(e){
    location.href=url;
  }
  showToast(amt>0?'토스 앱이 열리면 '+fmt(amt)+'원 송금을 진행해주세요!':'토스 앱에서 송금을 진행해주세요! <br>앱이 없으면 계좌번호로 직접 보내주세요');
}

function delPost(id){
  if(!isAdmin)return;
  if(!confirm('이 기록을 삭제할까요?'))return;
  fs.collection('birthday_posts').doc(id).delete().then(()=>{
    showToast('삭제되었습니다');
  }).catch(e=>{showToast('삭제 실패');console.warn(e)});
}

function openAdmin(){
  const card=document.getElementById('admin-pop-card');
  card.innerHTML='<h3>관리자 인증</h3><div class="pop-msg">타이틀·계좌·설정 관리, 기록 삭제가 가능해요.</div><input type="password" id="admin-pass" placeholder="비밀번호"><div class="pop-btns"><button class="pop-no" onclick="closePop()">취소</button><button class="pop-ok" onclick="tryAdmin()">확인</button></div>';
  document.getElementById('admin-pop').classList.remove('hidden');
  setTimeout(()=>document.getElementById('admin-pass').focus(),50);
}

function openSettings(){
  const card=document.getElementById('admin-pop-card');
  card.innerHTML=
    '<h3>설정</h3>'+
    '<label>타이틀</label><textarea id="st-title" rows="2" placeholder="동우야, 생일 축하해!"></textarea>'+
    '<label>이름</label><input id="st-name" placeholder="강동우">'+
    '<label>소개 문구</label><textarea id="st-subtitle" rows="2"></textarea>'+
    '<label>은행 이름</label><input id="st-bankname" placeholder="토스뱅크">'+
    '<label>계좌번호</label><input id="st-account" placeholder="190883754416">'+
    '<label>예금주</label><input id="st-holder" placeholder="강동우">'+
    '<label>후원 금액 버튼 (쉼표 구분)</label><input id="st-amounts" placeholder="5000,10000,30000,50000">'+
    '<div class="pop-btns"><button class="pop-no" onclick="closePop()">닫기</button><button class="pop-ok" onclick="saveSettings()">저장</button></div>';
  document.getElementById('st-title').value=settings.title;
  document.getElementById('st-name').value=settings.name;
  document.getElementById('st-subtitle').value=settings.subtitle;
  document.getElementById('st-bankname').value=settings.bankName;
  document.getElementById('st-account').value=settings.bankAccount;
  document.getElementById('st-holder').value=settings.bankHolder;
  document.getElementById('st-amounts').value=(settings.amounts||[]).join(',');
  document.getElementById('admin-pop').classList.remove('hidden');
}

async function saveSettings(){
  const amounts=(document.getElementById('st-amounts').value||'').split(',').map(s=>parseInt(s,10)).filter(n=>!isNaN(n)&&n>0);
  const data={
    title:document.getElementById('st-title').value,
    name:document.getElementById('st-name').value,
    subtitle:document.getElementById('st-subtitle').value,
    bankName:document.getElementById('st-bankname').value,
    bankAccount:document.getElementById('st-account').value,
    bankHolder:document.getElementById('st-holder').value,
    amounts:amounts.length?amounts:DEFAULT_SETTINGS.amounts,
  };
  try{
    await fs.collection('birthday_settings').doc('main').set(data);
    showToast('설정이 저장되었습니다');
    closePop();
  }catch(e){
    showToast('저장 실패. 다시 시도해주세요');
    console.warn(e);
  }
}

function tryAdmin(){
  const v=document.getElementById('admin-pass').value;
  if(v===ADMIN_PASS){
    isAdmin=true;
    document.body.classList.add('admin-on');
    closePop();
    showToast('관리자 모드 활성화');
  }else{
    showToast('비밀번호가 틀렸습니다');
    document.getElementById('admin-pass').value='';
  }
}

function closePop(){
  document.getElementById('admin-pop').classList.add('hidden');
}

function exitAdmin(){
  isAdmin=false;
  document.body.classList.remove('admin-on');
  showToast('관리자 모드 종료');
}

(function init(){
  if(!fs)return;
  fs.collection('birthday_settings').doc('main').onSnapshot(doc=>{
    if(doc.exists){
      settings=Object.assign({},DEFAULT_SETTINGS,doc.data());
    }
    applySettings();
  },e=>{console.warn(e);applySettings()});
  fs.collection('birthday_posts').orderBy('time','desc').onSnapshot(snap=>{
    postsCache=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderPosts(postsCache);
  },e=>{console.warn(e)});
  setTimeout(()=>fwCelebrate(4),900);
  setTimeout(()=>initFireworks(),1200);
  fs.collection('birthday_fireworks').doc('total').onSnapshot(d=>{
    fwTotal=d.exists?(Number(d.data().count)||0):0;
    updateFwCounter();
  },e=>{console.warn(e);updateFwCounter()});
  setInterval(()=>{
    if(document.hidden)return;
    if(Math.random()>0.6)return;
    const w=document.documentElement.clientWidth;
    const h=document.documentElement.clientHeight;
    const p=FW_PALETTES[Math.floor(Math.random()*FW_PALETTES.length)];
    fwRocket(w*(0.08+Math.random()*0.84),h+20,w*(0.15+Math.random()*0.7),h*(0.18+Math.random()*0.35),p);
  },3400);
  document.addEventListener('click',function(e){
    const t=e.target.closest('button,input,textarea,a,select,.amount-chip,.bb-btn,.del-btn,.admin-link,#tap-hint');
    if(t)return;
    if(!fwCanvas)initFireworks();
    fwTotal=(Number(fwTotal)||0)+1;
    updateFwCounter();
    if(fs)fs.collection('birthday_fireworks').doc('total').set({count:firebase.firestore.FieldValue.increment(1)},{merge:true}).catch(e=>console.warn('fw count',e));
    fwBurst(e.clientX,e.clientY,FW_PALETTES[Math.floor(Math.random()*FW_PALETTES.length)]);
  },true);
})();
</script>
